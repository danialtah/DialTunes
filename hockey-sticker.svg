<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 78" width="78" height="78">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="blade-clip">
      <path d="M39.4 65.1 L59.6 65.4 Q62 66 61.2 68.3 Q60.5 71.8 57 72.2 L50.5 72.5 Q42 72.4 38.8 70 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#wobble)" stroke="#0c0e10" stroke-width=".8" stroke-linejoin="round" stroke-linecap="round">
    <!-- puck: all black, 30% smaller -->
    <g transform="translate(20 68) scale(0.7) translate(-20 -68)">
      <path d="M11 66 L11 69 Q11 72.5 20 72.5 Q29 72.5 29 69 L29 66 Z" fill="#0c0e10"/>
      <ellipse cx="20" cy="66" rx="9" ry="3.2" fill="#0c0e10"/>
    </g>

    <!-- shaft and blade as one shape -->
    <path d="M17.95 7.25 L21.6 6.6 L39.4 65.1 L59.6 65.4 Q62 66 61.2 68.3 Q60.5 71.8 57 72.2 L50.5 72.5 Q42 72.4 38.8 70 L36.9 65.1 Z" fill="#1a1d22" stroke="none"/>

    <!-- teal grip tape: covers the knob and the top of the shaft -->
    <rect x="16.4" y="4" width="6.2" height="3" rx="1.2" fill="#1fa6a0"/>
    <path d="M17.9 6.8 L21.9 6.8 L25.98 21 L22.45 21 Z" fill="#1fa6a0" stroke="none"/>
    <g stroke="#0f6f6b" stroke-width=".5">
      <line x1="18.9" y1="10" x2="22.7" y2="12.2"/>
      <line x1="19.9" y1="13" x2="23.7" y2="15.2"/>
      <line x1="20.9" y1="16" x2="24.7" y2="18.2"/>
      <line x1="21.9" y1="19" x2="25.6" y2="21.2"/>
    </g>

    <!-- pastel pink tape on the heel of the blade; the toe stays black -->
    <g clip-path="url(#blade-clip)" stroke="none">
      <rect x="37" y="62" width="21" height="14" fill="#f6b8d1"/>
      <g stroke="#e58fb4" stroke-width=".6">
        <line x1="37" y1="64" x2="41" y2="73"/>
        <line x1="40.5" y1="64" x2="44.5" y2="73"/>
        <line x1="44" y1="64" x2="48" y2="73"/>
        <line x1="47.5" y1="64" x2="51.5" y2="73"/>
        <line x1="51" y1="64" x2="55" y2="73"/>
        <line x1="54.5" y1="64" x2="58.5" y2="73"/>
      </g>
    </g>

    <!-- outline on top, so the edges stay crisp -->
    <path d="M17.95 7.25 L21.6 6.6 L39.4 65.1 L59.6 65.4 Q62 66 61.2 68.3 Q60.5 71.8 57 72.2 L50.5 72.5 Q42 72.4 38.8 70 L36.9 65.1 Z" fill="none" stroke="#0c0e10" stroke-width=".8"/>

    <!-- silver-white text along the shaft -->
    <!-- hand-drawn "DT #22" in silver-white, drawn as strokes along the shaft -->
    <g transform="translate(28.7 35) rotate(72.5) scale(0.72)" fill="none" stroke="#d9dde3" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7.2 -1.4 H-6.1 Q-4.5 -1.5 -4.5 0 Q-4.5 1.5 -6.1 1.4 H-7.2 Z"/>
      <path d="M-3.7 -1.5 H-1.8 M-2.75 -1.5 L-2.9 1.5"/>
      <path d="M0.2 -1.5 L-0.1 1.5 M1.5 -1.4 L1.2 1.6 M-0.4 -0.4 H1.9 M-0.6 0.6 H1.7"/>
      <path d="M2.6 -0.8 Q2.6 -1.5 3.4 -1.4 Q4.3 -1.3 4.2 -0.6 Q4.1 0 2.6 1.5 H4.3"/>
      <path d="M4.8 -0.8 Q4.8 -1.5 5.6 -1.4 Q6.5 -1.3 6.4 -0.6 Q6.3 0 4.8 1.5 H6.5"/>
    </g>
  </g>
</svg>
